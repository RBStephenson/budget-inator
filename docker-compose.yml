services:
  backend:
    build: ./backend
    # Bind to loopback only — the API is unauthenticated and must not be
    # reachable from the LAN. Access via the proxy at http://localhost:8090.
    # Host port 8001 (container stays 8000) to avoid colliding with other
    # local projects that use 8000.
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./data:/data
    environment:
      - DATABASE_URL=sqlite:////data/budget.db
      - CORS_ORIGINS=["http://localhost:8090"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health", timeout=2).close()
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5174:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      # 8080 collides with NVIDIA Broadcast's local web server on this
      # machine (discovered 2026-08-02) — moved to 8090 to avoid it.
      - "127.0.0.1:8090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
