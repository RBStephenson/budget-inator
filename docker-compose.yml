services:
  backend:
    build: ./backend
    # Bind to loopback only — the API is unauthenticated and must not be
    # reachable from the LAN. Access via the proxy at http://localhost:8080.
    # Host port 8001 (container stays 8000) to avoid colliding with other
    # local projects that use 8000.
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./data:/data
    environment:
      - DATABASE_URL=sqlite:////data/budget.db
      - CORS_ORIGINS=["http://localhost:8080"]
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5174:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
