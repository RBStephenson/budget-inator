[project]
name = "budget-inator-backend"
# Not a distributable package; releases are versioned by git tags.
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy>=2.1.2",
    "alembic>=1.20.0",
    "pydantic-settings>=2.15.0",
    "reportlab>=5.0.1",
    # The new 422 constant name first exists in 0.48.0 (BI-72).
    "starlette>=0.48.0",
    # Indirect (via reportlab), pinned for security: 13.0.0 fixes 41
    # advisories published 2026-10-22/23 (BI-73).
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
]
# Standalone executable build (.github/workflows/build.yml).
build = [
    "pyinstaller>=6.22.3",
]

[tool.uv]
# The backend runs from its source tree; it is never built or installed.
package = false
# uv.lock is shared with Dependabot's uv updater; keep both on one uv
# version so neither writes a lock the other can't read (BI-74).
required-version = "==0.11.23"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["I001"]
"alembic/versions/*.py" = ["I001"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deprecation warnings raised from our own code fail the suite, so a removed
# library name can't turn a 422 into a 500. Matched by message, not class:
# StarletteDeprecationWarning doesn't exist at our starlette floor (0.48.0).
# Library-internal warnings are unaffected.
filterwarnings = [
    "error:.*deprecated:Warning:app",
]
