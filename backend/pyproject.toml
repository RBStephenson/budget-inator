[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["I001"]
"alembic/versions/*.py" = ["I001"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deprecation warnings raised from our own code fail the suite, so a removed
# library name can't turn a 422 into a 500. Matched by message, not class:
# StarletteDeprecationWarning doesn't exist at our starlette floor (0.48.0).
# Library-internal warnings are unaffected.
filterwarnings = [
    "error:.*deprecated:Warning:app",
]
