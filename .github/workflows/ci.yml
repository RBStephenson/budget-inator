name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Detect scaffolded directories ─────────────────────────────────────────
  detect:
    name: Detect project dirs
    runs-on: ubuntu-latest
    outputs:
      has_backend: ${{ steps.check.outputs.has_backend }}
      has_frontend: ${{ steps.check.outputs.has_frontend }}
    steps:
      - uses: actions/checkout@v7
      - name: Check which directories exist
        id: check
        run: |
          echo "has_backend=$([ -f backend/requirements.txt ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "has_frontend=$([ -f frontend/package.json ] && echo true || echo false)" >> $GITHUB_OUTPUT

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_backend == 'true'
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy app

      - name: Tests (pytest)
        run: pytest --tb=short --cov=app --cov-report=term-missing

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (React/TS)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_frontend == 'true'
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests (Vitest)
        run: npm run test -- --run

      - name: Build
        run: npm run build
