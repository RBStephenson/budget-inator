version: 2

updates:
  # ── Python (backend) ──────────────────────────────────────────────────────
  # uv ecosystem: updates pyproject.toml + uv.lock, so indirect dependencies
  # are visible with exact versions (BI-74).
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - python
    groups:
      prod-deps:
        dependency-type: production
      dev-deps:
        dependency-type: development

  # ── npm (frontend) ────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - javascript
    groups:
      prod-deps:
        dependency-type: production
      dev-deps:
        dependency-type: development

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
